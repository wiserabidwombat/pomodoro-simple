name: Pomodoro
options:
  bundleIdPrefix: com.aarontilley.pomodoro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: WP28RC7K7L
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pomodoro:
    type: application
    platform: iOS
    sources:
      - path: Pomodoro
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarontilley.pomodoro
        INFOPLIST_FILE: Pomodoro/Info.plist
        CODE_SIGN_ENTITLEMENTS: Pomodoro/Pomodoro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PomodoroWidgetExtension
        embed: true
      # Embedded via the "Embed Watch Content" phase, so installing the
      # iPhone app offers the watch app on a paired Apple Watch.
      - target: PomodoroWatch
        embed: true
  PomodoroWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PomodoroWidget
      - path: Shared
        # The widget never talks to the watch; WatchConnectivity is for the
        # iPhone app and the watch app only.
        excludes:
          - WatchConnectivityRelay.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarontilley.pomodoro.widget
        INFOPLIST_FILE: PomodoroWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PomodoroWidget/PomodoroWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  PomodoroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PomodoroTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pomodoro
  PomodoroWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: PomodoroWatch
      # Only the Shared files that compile on watchOS: the ActivityKit /
      # WidgetKit / notification-scheduling ones stay iPhone-only.
      - path: Shared/AppGroup.swift
      - path: Shared/AccentColorOption.swift
      - path: Shared/ChimeOption.swift
      - path: Shared/PomodoroPhase.swift
      - path: Shared/PomodoroState.swift
      - path: Shared/PomodoroDurations.swift
      - path: Shared/PomodoroStateStore.swift
      - path: Shared/TimerEngine.swift
      - path: Shared/TimerProfile.swift
      - path: Shared/WatchConnectivityRelay.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarontilley.pomodoro.watchkitapp
        INFOPLIST_FILE: PomodoroWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  Pomodoro:
    build:
      targets:
        Pomodoro: all
        PomodoroTests: [test]
    test:
      targets:
        - PomodoroTests
    run:
      config: Debug
